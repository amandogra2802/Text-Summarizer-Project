TrainingArguments:
  num_train_epochs: 1
  warmup_steps: 500
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  weight_decay: 0.01
  logging_steps: 100
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  gradient_accumulation_steps: 4
  fp16: true
  predict_with_generate: true
  report_to: none

GenerationArguments:
  num_beams: 4
  length_penalty: 0.8
  max_new_tokens: 128
  no_repeat_ngram_size: 3